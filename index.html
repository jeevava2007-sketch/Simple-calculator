<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RootRaja Simple Calculator</title>
<style>
/* ============================================================
   ROOTRAJA SIMPLE CALCULATOR
   Single-file HTML + CSS + JavaScript calculator
   ============================================================ */

/* ---------- Reset ---------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ---------- Page ---------- */
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  font-family: "Segoe UI", Arial, sans-serif;
  color: #e2e8f0;
  padding: 20px;
}

/* ---------- Calculator card ---------- */
.calculator {
  width: 100%;
  max-width: 380px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
}

/* ---------- Display ---------- */
.display {
  background: #0b1120;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 18px;
  text-align: right;
  overflow: hidden;
}

.expression {
  min-height: 22px;
  font-size: 15px;
  color: #94a3b8;
  word-break: break-all;
}

.result {
  min-height: 48px;
  font-size: 38px;
  font-weight: 700;
  color: #f8fafc;
  word-break: break-all;
}

/* ---------- Button grid ---------- */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 18px 0;
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  background: #1f2937;
  color: #e2e8f0;
  transition: transform 0.08s ease, background 0.15s ease;
}

button:hover {
  background: #334155;
}

button:active {
  transform: scale(0.96);
}

.operator {
  background: #0ea5e9;
  color: #04121d;
}

.equal {
  background: #22c55e;
  color: #052e16;
  grid-column: span 2;
}

.clear {
  background: #ef4444;
  color: #fff;
}

.delete {
  background: #f59e0b;
  color: #1f1300;
}

.span-2 {
  grid-column: span 2;
}

/* ---------- Footer ---------- */
.footer {
  margin-top: 16px;
  text-align: center;
  font-size: 13px;
  color: #64748b;
}

@media (max-width: 420px) {
  .calculator {
    padding: 16px;
  }
  .result {
    font-size: 30px;
  }
  button {
    padding: 15px 0;
    font-size: 18px;
  }
}

<body>

<main class="calculator">
  <section class="display">
    <div class="expression" id="expression">0</div>
    <div class="result" id="result">0</div>
  </section>

  <section class="buttons">
    <button class="clear" onclick="clearAll()">AC</button>
    <button class="delete" onclick="deleteLast()">DEL</button>
    <button class="operator" onclick="addOperator('%')">%</button>
    <button class="operator" onclick="addOperator('/')">÷</button>

    <button onclick="addNumber('7')">7</button>
    <button onclick="addNumber('8')">8</button>
    <button onclick="addNumber('9')">9</button>
    <button class="operator" onclick="addOperator('*')">×</button>

    <button onclick="addNumber('4')">4</button>
    <button onclick="addNumber('5')">5</button>
    <button onclick="addNumber('6')">6</button>
    <button class="operator" onclick="addOperator('-')">−</button>

    <button onclick="addNumber('1')">1</button>
    <button onclick="addNumber('2')">2</button>
    <button onclick="addNumber('3')">3</button>
    <button class="operator" onclick="addOperator('+')">+</button>

    <button onclick="addNumber('0')">0</button>
    <button onclick="addDot()">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </section>

  <p class="footer">RootRaja Calculator • HTML + CSS + JS 😎</p>
</main>

<script>
/* ============================================================
   CALCULATOR LOGIC
   ============================================================ */

let expression = "";
let lastAnswer = "0";

const expressionScreen = document.getElementById("expression");
const resultScreen = document.getElementById("result");

function updateScreen() {
  expressionScreen.textContent = expression || "0";
  resultScreen.textContent = lastAnswer;
}

function addNumber(number) {
  expression += number;
  updateScreen();
}

function addDot() {
  const parts = expression.split(/[^0-9.]/);
  const current = parts[parts.length - 1] || "";
  if (!current.includes(".")) {
    expression += current === "" ? "0." : ".";
  }
  updateScreen();
}

function addOperator(operator) {
  if (expression === "" && lastAnswer !== "0") {
    expression = lastAnswer + operator;
  } else if (expression !== "") {
    const lastChar = expression.slice(-1);
    if ("+-*/%".includes(lastChar)) {
      expression = expression.slice(0, -1) + operator;
    } else {
      expression += operator;
    }
  }
  updateScreen();
}

function clearAll() {
  expression = "";
  lastAnswer = "0";
  updateScreen();
}

function deleteLast() {
  expression = expression.slice(0, -1);
  updateScreen();
}

function safeEvaluate(input) {
  if (!/^[0-9+\-*/%.() ]+$/.test(input)) {
    return "Error";
  }
  try {
    const value = Function('"use strict"; return (' + input + ")")();
    if (value === undefined || value === null || Number.isNaN(value)) {
      return "Error";
    }
    if (!Number.isFinite(value)) {
      return "Cannot divide by 0";
    }
    return String(Math.round(value * 100000000) / 100000000);
  } catch (error) {
    return "Error";
  }
}

function calculate() {
  if (expression === "") return;
  const answer = safeEvaluate(expression);
  lastAnswer = answer;
  expression = answer === "Error" || answer.includes("divide") ? "" : answer;
  updateScreen();
}

document.addEventListener("keydown", function (event) {
  const key = event.key;
  if (key >= "0" && key <= "9") addNumber(key);
  else if (key === ".") addDot();
  else if (["+", "-", "*", "/", "%"].includes(key)) addOperator(key);
  else if (key === "Enter" || key === "=") calculate();
  else if (key === "Backspace") deleteLast();
  else if (key === "Escape") clearAll();
});

updateScreen();
</script>
